[package]
name = "bilan"
version = "0.1.2"
edition = "2024"
description = "Weekly review crossing sport, gaming, dev and videos"
license = "MIT"

[dependencies]
egui = "0.37.0"
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links"] }
winit = "0.30.13"
softbuffer = "0.4.8"
hdrshot-egui-backend = "0.2.0"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
socle = { git = "https://github.com/Desarrh/socle", tag = "v0.1.6", default-features = false, features = ["ui", "settings", "crash", "instance", "update", "testmode"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
